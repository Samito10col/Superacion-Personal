spring.application.name=backend
server.port=8081

# Base de datos (Docker local)
spring.datasource.url=jdbc:postgresql://localhost:5440/habitos
spring.datasource.username=habitos
spring.datasource.password=habitos_dev

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET:dev-secreto-superacion-personal-solo-para-desarrollo-local-2026}
app.jwt.expiracion-minutos=10080


# Evidencias (fotos)
app.evidencias.directorio=${EVIDENCIAS_DIR:./uploads/evidencias}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB


# Validacion entre companeros (RN-12)
app.validacion.horas-limite=48

# Origenes autorizados para la app web (CORS)
app.cors.origenes=http://localhost:8082