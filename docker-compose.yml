services:
  db:
    image: postgres:17
    container_name: habitos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: habitos
      POSTGRES_USER: habitos
      POSTGRES_PASSWORD: habitos_dev
    ports:
      - "5433:5432"
    volumes:
      - habitos-data:/var/lib/postgresql/data

volumes:
  habitos-data:
